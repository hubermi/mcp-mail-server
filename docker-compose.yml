# Example Docker Compose setup for mcp-mail-server.
#
# Runs the MCP server as a long-lived network service using the Streamable
# HTTP transport. MCP clients connect to:
#
#   http://localhost:8000/mcp        (health check: http://localhost:8000/healthz)
#
#   docker compose up -d
#
# Set MCP_AUTH_TOKEN in .mcp.env (e.g. `openssl rand -hex 32`); clients must
# then send `Authorization: Bearer <token>`. Without it the endpoint accepts
# unauthenticated requests and gives full access to the mailbox. The port is
# published on 127.0.0.1 only; expose it beyond localhost only behind TLS.
#
# Credentials are read from .mcp.env (copy .env.example and fill it in).
# The container runs as the unprivileged `node` user (UID 1000), so create the
# attachment folder with matching ownership before the first start:
#
#   mkdir -p mcp-mail-data && sudo chown 1000:1000 mcp-mail-data
services:
  mcp-mail-server:
    image: ghcr.io/hubermi/mcp-mail-server:latest
    init: true
    restart: unless-stopped
    env_file: .mcp.env
    environment:
      MCP_TRANSPORT: streamableHttp # or sse (http://localhost:8000/sse)
      MCP_PORT: 8000
      # Allow attachment downloads/uploads inside the mounted /data volume.
      MAIL_ALLOWED_ROOTS: /data
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./mcp-mail-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
